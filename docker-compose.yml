# Glimpse: everything runs in Docker. Nothing to install on the host except Docker itself.
#
#   cp .env.example .env                              # then fill in the passwords
#   docker compose up -d --build                      # http://localhost:8090
#   docker compose --profile tunnel up -d --build     # also start the Cloudflare tunnel
#
# Startup order: db + redis + storage -> migrate (applies schema changes, then exits) -> api-1, api-2, worker, web -> proxy -> tunnel.
# Memory limits keep the whole stack around 3.8 GB so it can share a 2018 MacBook Pro with Veritas.
name: glimpse

x-api: &api
  build: ./apps/api
  image: glimpse-api
  restart: unless-stopped
  environment: &api-env
    # The app role: not a superuser, can't bypass row-level security.
    DATABASE_URL: postgres://glimpse_app:${APP_DB_PASSWORD}@db:5432/glimpse
    REDIS_CACHE_URL: redis://redis-cache:6379
    REDIS_QUEUE_URL: redis://redis-queue:6379
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8090}
    TRUST_PROXY: "1"
    ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    FANOUT_THRESHOLD: ${FANOUT_THRESHOLD:-10000}
    # Object storage: the API and worker talk to it directly; browsers reach it through Caddy.
    S3_ENDPOINT: http://storage:8333
    S3_PUBLIC_ENDPOINT: ${APP_ORIGIN:-http://localhost:8090}
    S3_ACCESS_KEY: glimpse
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis-cache: { condition: service_healthy }
    redis-queue: { condition: service_healthy }
    storage: { condition: service_healthy }
  deploy:
    resources:
      limits: { memory: 320m }

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glimpse_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: glimpse
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100"]
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glimpse_owner -d glimpse"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512m }

  # Cache: may lose data at any time (no persistence). Evicts least-recently-used keys when full.
  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 192m }

  # Queues + realtime streams: must not lose or evict jobs. Append-only file, no eviction.
  redis-queue:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 320m }

  # S3-compatible object storage for photos and videos (DECISIONS.md D14). Not exposed to the host:
  # browsers reach it only through Caddy (GET /media/*, PUT /uploads/*).
  storage:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-4.40}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/seaweedfs.sh"]
    environment:
      S3_ACCESS_KEY: glimpse
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - ./deploy/seaweedfs.sh:/seaweedfs.sh:ro
      - storage-data:/data
    healthcheck:
      # master answering + S3 port open (S3 itself answers 403 to anonymous probes, which is correct)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 384m }

  # Runs every pending migration as the database owner, creates/updates the app and worker roles, then exits.
  migrate:
    build: ./apps/api
    image: glimpse-api
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://glimpse_owner:${POSTGRES_PASSWORD}@db:5432/glimpse
      APP_DB_ROLE: glimpse_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    depends_on:
      db: { condition: service_healthy }

  # Two identical API instances behind Caddy. Any instance can serve any request:
  # sessions live in Postgres, cache/rate limits/presence in Redis, live events go through Redis streams.
  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  # Background jobs: media processing, feed fan-out, notifications, maintenance, and the outbox relay.
  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    environment:
      <<: *api-env
      INSTANCE_ID: worker-1
      WORKER_DATABASE_URL: postgres://glimpse_worker:${WORKER_DB_PASSWORD}@db:5432/glimpse
    deploy:
      resources:
        limits: { memory: 640m } # ffmpeg
    tmpfs:
      - /tmp:size=512m # video transcoding scratch space (originals are deleted after processing)

  # Live video: browser -> WebSocket -> ffmpeg -> HLS (DECISIONS.md D16). Stateful by nature (a stream
  # lives in the process ingesting it), so it's its own service and isn't load-balanced.
  live:
    <<: *api
    command: ["node", "dist/live.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/stream/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
    environment:
      <<: *api-env
      INSTANCE_ID: live-1
      LIVE_DIR: /tmp/live
      MAX_LIVE_MINUTES: ${MAX_LIVE_MINUTES:-60}
    tmpfs:
      - /tmp/live:size=256m # rolling HLS window only; deleted when a stream ends
    deploy:
      resources:
        limits: { memory: 768m } # one 720p ffmpeg encode per active stream

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8090}
    depends_on:
      - api-1
      - api-2
    deploy:
      resources:
        limits: { memory: 256m }

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Bound to localhost only, on a port that won't clash with Veritas. Change HOST_PORT in .env if needed.
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api-1
      - api-2
      - web
      - storage
      - live
    deploy:
      resources:
        limits: { memory: 96m }

  # Separate Cloudflare tunnel for Glimpse, so it can't affect Veritas's tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - proxy

volumes:
  db-data:
  queue-data:
  storage-data:
