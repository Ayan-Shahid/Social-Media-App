<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Served by Caddy when the app behind it isn't answering (usually a deploy). Reloads itself. -->
<meta http-equiv="refresh" content="6">
<title>Back in a moment · Glimpse</title>
<style>
  :root { color-scheme: light dark; --bg: #eceef1; --paper: #f7f8fa; --ink: #15171c; --muted: #5d6270; --rule: #d5d9e0; --grid: rgba(21, 23, 28, .05); --accent: #d2691e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --paper: #171a20; --ink: #e9ebef; --muted: #9aa0ad; --rule: #2a2f38; --grid: rgba(255, 255, 255, .035); --accent: #f08a3e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; padding: 36px 28px; border: 1px solid var(--rule); border-radius: 20px;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; background-position: -1px -1px; }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  h1 { font-size: 20px; margin: 22px 0 6px; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  .dots { display: inline-flex; gap: 6px; margin-top: 22px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
  a { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <main>
    <div class="logo">Glimpse<span>.</span></div>
    <h1>Back in a moment</h1>
    <p>Glimpse is updating. This page will reload by itself as soon as it's back.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p style="margin-top:18px;font-size:13px">Nothing you've posted is affected. <a href="">Reload now</a></p>
  </main>
</body>
</html>
